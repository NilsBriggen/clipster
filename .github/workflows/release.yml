name: Release

# A v* tag builds the AppImage and the .msi and publishes them as a GitHub release.
# Running it by hand only builds them (as workflow artifacts), to check the packaging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distributions
            format: appimage
            files: app/dist/*.AppImage
          - os: windows-latest
            format: wix
            files: app/dist/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # a tag pushed before the version bump would ship old binaries as the new version (installed copies would then
      # offer the "update" every day)
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but app/Cargo.toml says $version. Bump the version first."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2 file
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        run: cargo packager --release --formats ${{ matrix.format }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
      - uses: actions/upload-artifact@v5
        with:
          name: clipster-${{ matrix.format }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the release description is this version's section of CHANGELOG.md; no section, no release
      - name: Release description from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Write the release description there first."
            exit 1
          fi
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Clipster $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
